version: "3.9"

services:
  postgres:
    container_name: postgres_application
    image: postgres:16-alpine3.23
    restart: always
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - application-network

volumes:
  postgres-data:

networks:
  application-network:
